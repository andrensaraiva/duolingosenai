<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotoCode Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Semantic Colors mapped to CSS Variables
              background: 'rgb(var(--bg-color) / <alpha-value>)',
              surface: 'rgb(var(--surface-color) / <alpha-value>)',
              
              // Mapping 'boto' to the Primary Theme Color
              boto: {
                50: 'rgb(var(--primary-color) / 0.1)',
                100: 'rgb(var(--primary-color) / 0.2)',
                300: 'rgb(var(--primary-color) / 0.6)',
                500: 'rgb(var(--primary-color) / 1)', // Main Primary
                600: 'rgb(var(--primary-color) / 0.8)',
                900: 'rgb(var(--primary-color) / 0.4)',
              },
              
              // Mapping 'tech' to Secondary Theme Color
              tech: {
                purple: 'rgb(var(--secondary-color) / 1)',
                pink: 'rgb(var(--accent-color) / 1)',
                green: '#10b981', 
              }
            },
            fontFamily: {
              sans: ['var(--font-body)', 'sans-serif'],
              mono: ['var(--font-heading)', 'monospace'],
              // Specific aliases
              tech: ['var(--font-heading)', 'monospace'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glitch': 'glitch 1s linear infinite',
              'bounce-slow': 'bounce 3s infinite',
              'river-flow': 'riverFlow 20s linear infinite',
            },
            keyframes: {
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              },
              riverFlow: {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '0% 100%' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&family=Russo+One&family=Quicksand:wght@500;700&family=Graduate&display=swap" rel="stylesheet">
    <style>
      /* --- THEME DEFINITIONS --- */
      
      /* Theme 1: PORTO (original) */
      :root, .theme-cyber {
        --bg-color: 79 195 247;       /* Céu do porto */
        --surface-color: 215 204 200;  /* Madeira clara */
        --primary-color: 255 202 40;   /* Dourado porto */
        --secondary-color: 141 110 99; /* Marrom cais */
        --accent-color: 93 64 55;      /* Aro madeira */
        
        --font-heading: 'Nunito';
        --font-body: 'Nunito';
        
        --bg-pattern: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 55%),
                      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.18), transparent 45%),
                      radial-gradient(circle at 80% 10%, rgba(255,255,255,0.12), transparent 40%);
        --bg-size: 280px 280px;
      }

      /* Theme 2: GAMES (pixel art) */
      .theme-game {
        --bg-color: 33 33 33;        /* Noite arcade */
        --surface-color: 26 26 26;   /* Console escuro */
        --primary-color: 0 255 153;  /* Verde CRT */
        --secondary-color: 255 0 255; /* Magenta neon */
        --accent-color: 255 235 59;   /* Amarelo painel */
        
        --font-heading: 'Press Start 2P';
        --font-body: 'Nunito';
        
        --bg-pattern: linear-gradient(90deg, rgba(255, 0, 255, 0.18) 1px, transparent 1px),
                      linear-gradient(0deg, rgba(0, 255, 153, 0.16) 1px, transparent 1px);
        --bg-size: 32px 32px;
      }

      /* Theme 3: ESPORTES */
      .theme-sport {
        --bg-color: 236 239 241;     /* Arena iluminada */
        --surface-color: 255 255 255; /* Placar branco */
        --primary-color: 255 82 82;   /* Laranja chuteira */
        --secondary-color: 41 121 255; /* Azul estádio */
        --accent-color: 255 207 74;    /* Luz de vitória */
        
        --font-heading: 'Russo One';
        --font-body: 'Russo One';
        
        --bg-pattern: linear-gradient(135deg, rgba(26,35,126,0.08) 16%, transparent 16%),
                      linear-gradient(315deg, rgba(26,35,126,0.05) 12%, transparent 12%);
        --bg-size: 140px 140px;
      }

      /* Global Resets */
      body {
        font-family: var(--font-body), sans-serif;
        background-color: rgb(var(--bg-color));
        color: #2d1f18;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      h1, h2, h3, .font-tech {
        font-family: var(--font-heading), sans-serif;
      }

      .theme-grid-bg {
        background-image: var(--bg-pattern);
        background-size: var(--bg-size);
      }
      
      /* Wave Overlay for Porto */
      .porto-wave-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .porto-wave {
        position: absolute;
        left: 50%;
        width: 160%;
        height: 160%;
        background: radial-gradient(circle at 50% 50%, rgba(52, 152, 219, 0.12), transparent 60%),
                    repeating-linear-gradient(180deg, rgba(255,255,255,0.08) 0, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 12px);
        opacity: 0.4;
        transform: translateX(-50%) translateY(-35%) scaleY(0.8);
        animation: portoWaves 16s linear infinite;
      }

      @keyframes portoWaves {
        0% {
          transform: translateX(-50%) translateY(-35%) scaleY(0.8) rotate(0deg);
        }
        50% {
          transform: translateX(-48%) translateY(-33%) scaleY(0.85) rotate(3deg);
        }
        100% {
          transform: translateX(-50%) translateY(-35%) scaleY(0.8) rotate(0deg);
        }
      }

      .pixel-scanlines {
        background-image: linear-gradient(rgba(0,0,0,0.25) 1px, transparent 1px);
        background-size: 100% 3px;
      }

      .sport-stripe::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, rgba(255,99,71,0.2) 0%, transparent 45%, rgba(41,121,255,0.18) 100%);
        pointer-events: none;
      }

      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      
      .neon-glow {
        box-shadow: 0 0 10px rgb(var(--primary-color) / 0.5);
      }
    </style>
