<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotoCode Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Semantic Colors mapped to CSS Variables
              background: 'rgb(var(--bg-color) / <alpha-value>)',
              surface: 'rgb(var(--surface-color) / <alpha-value>)',
              
              // Mapping 'boto' to the Primary Theme Color
              boto: {
                50: 'rgb(var(--primary-color) / 0.1)',
                100: 'rgb(var(--primary-color) / 0.2)',
                300: 'rgb(var(--primary-color) / 0.6)',
                500: 'rgb(var(--primary-color) / 1)', // Main Primary
                600: 'rgb(var(--primary-color) / 0.8)',
                900: 'rgb(var(--primary-color) / 0.4)',
              },
              
              // Mapping 'tech' to Secondary Theme Color
              tech: {
                purple: 'rgb(var(--secondary-color) / 1)',
                pink: 'rgb(var(--accent-color) / 1)',
                green: '#10b981', 
              }
            },
            fontFamily: {
              sans: ['var(--font-body)', 'sans-serif'],
              mono: ['var(--font-heading)', 'monospace'],
              // Specific aliases
              tech: ['var(--font-heading)', 'monospace'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glitch': 'glitch 1s linear infinite',
              'bounce-slow': 'bounce 3s infinite',
              'river-flow': 'riverFlow 20s linear infinite',
            },
            keyframes: {
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              },
              riverFlow: {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '0% 100%' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&family=Russo+One&display=swap" rel="stylesheet">
    <style>
      /* --- THEME DEFINITIONS --- */
      
      /* Theme 1: CYBER (Default) */
      :root, .theme-cyber {
        --bg-color: 15 23 42;       /* Slate 900 */
        --surface-color: 30 41 59;  /* Slate 800 */
        --primary-color: 6 182 212; /* Cyan 500 */
        --secondary-color: 139 92 246; /* Violet 500 */
        --accent-color: 217 70 239; /* Fuchsia 500 */
        
        --font-heading: 'Fira Code';
        --font-body: 'Nunito';
        
        --bg-pattern: linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
        --bg-size: 40px 40px;
      }

      /* Theme 2: RETRO GAME */
      .theme-game {
        --bg-color: 20 5 30;        /* Deep Purple/Black */
        --surface-color: 60 10 60;  /* Dark Magenta */
        --primary-color: 255 0 128; /* Hot Pink */
        --secondary-color: 249 217 35; /* Arcade Yellow */
        --accent-color: 57 255 20;  /* Matrix Green */
        
        --font-heading: 'Press Start 2P';
        --font-body: 'Nunito';
        
        --bg-pattern: radial-gradient(rgba(255, 0, 128, 0.2) 2px, transparent 2px);
        --bg-size: 20px 20px;
      }

      /* Theme 3: SPORTS */
      .theme-sport {
        --bg-color: 17 24 39;       /* Gray 900 */
        --surface-color: 31 41 55;  /* Gray 800 */
        --primary-color: 249 115 22; /* Orange 500 */
        --secondary-color: 37 99 235; /* Blue 600 */
        --accent-color: 239 68 68;   /* Red 500 */
        
        --font-heading: 'Russo One';
        --font-body: 'Nunito';
        
        --bg-pattern: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 0, transparent 50%);
        --bg-size: 20px 20px;
      }

      /* Global Resets */
      body {
        font-family: var(--font-body), sans-serif;
        background-color: rgb(var(--bg-color));
        color: #f8fafc;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      h1, h2, h3, .font-tech {
        font-family: var(--font-heading), monospace;
      }

      .theme-grid-bg {
        background-image: var(--bg-pattern);
        background-size: var(--bg-size);
      }
      
      /* Neon River Effect */
      .neon-river-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        perspective: 500px;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      
      .neon-river-grid {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: 
          linear-gradient(transparent 0%, rgb(var(--primary-color) / 0.1) 2%, transparent 3%),
          linear-gradient(90deg, transparent 0%, rgb(var(--primary-color) / 0.1) 2%, transparent 3%);
        background-size: 100px 100px;
        transform: rotateX(60deg);
        animation: riverFlow 10s linear infinite;
        mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 80%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 80%, transparent 100%);
      }

      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      
      .neon-glow {
        box-shadow: 0 0 10px rgb(var(--primary-color) / 0.5);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>

</head>
